<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Download Center | My YouTube</title>

    <meta name="description" content="আমার YouTube ভিডিওর প্রয়োজনীয় ফাইল, নোটস ও রিসোর্স ডাউনলোড করুন।">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: "class"
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            transition: background-color .3s, color .3s;
        }

        .glass {
            background: rgba(255,255,255,.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .dark .glass {
            background: rgba(15,23,42,.75);
        }

        .file-card {
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .file-card:hover {
            transform: translateY(-5px);
        }

        .modal {
            animation: popup .2s ease-out;
        }

        @keyframes popup {
            from {
                opacity: 0;
                transform: scale(.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .gradient-text {
            background: linear-gradient(90deg,#2563eb,#7c3aed,#db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen">

<!-- ================= HEADER ================= -->

<header class="relative overflow-hidden bg-gradient-to-br from-blue-700 via-indigo-700 to-purple-800 text-white">

    <div class="absolute inset-0 opacity-10">
        <div class="absolute -top-20 -left-20 w-72 h-72 bg-white rounded-full blur-3xl"></div>
        <div class="absolute top-20 right-0 w-80 h-80 bg-pink-400 rounded-full blur-3xl"></div>
    </div>

    <div class="relative max-w-6xl mx-auto px-5 py-12 md:py-16">

        <div class="flex justify-between items-center mb-10">

            <div class="font-bold text-lg">
                📦 My Download Center
            </div>

            <button
                onclick="toggleDarkMode()"
                class="glass text-slate-800 dark:text-white px-4 py-2 rounded-full text-sm font-semibold">
                🌙 Theme
            </button>

        </div>

        <div class="text-center">

            <div class="inline-block px-4 py-2 rounded-full bg-white/15 border border-white/20 text-sm mb-5">
                🎬 Official YouTube Resources
            </div>

            <h1 class="text-4xl md:text-6xl font-black leading-tight">
                Download Center
            </h1>

            <p class="mt-5 text-blue-100 max-w-2xl mx-auto text-sm md:text-lg">
                আমার YouTube ভিডিওর প্রয়োজনীয় ফাইল, নোটস,
                সোর্স কোড এবং অন্যান্য রিসোর্স এখান থেকে ডাউনলোড করুন।
            </p>

        </div>

    </div>
</header>


<!-- ================= MAIN ================= -->

<main class="max-w-6xl mx-auto px-5 py-10">

    <!-- Statistics -->

    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">

        <div class="glass rounded-2xl border border-slate-200 dark:border-slate-800 p-5 text-center shadow-sm">
            <div class="text-3xl font-black text-blue-600" id="totalFiles">
                0
            </div>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                মোট ফাইল
            </p>
        </div>

        <div class="glass rounded-2xl border border-slate-200 dark:border-slate-800 p-5 text-center shadow-sm">
            <div class="text-3xl font-black text-purple-600">
                🔐
            </div>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                PIN Protected
            </p>
        </div>

        <div class="hidden md:block glass rounded-2xl border border-slate-200 dark:border-slate-800 p-5 text-center shadow-sm">
            <div class="text-3xl font-black text-green-600">
                ⚡
            </div>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                Fast Download
            </p>
        </div>

    </div>


    <!-- Search -->

    <div class="mb-8">

        <div class="relative">

            <span class="absolute left-4 top-1/2 -translate-y-1/2">
                🔎
            </span>

            <input
                id="searchBox"
                oninput="searchFiles()"
                type="text"
                placeholder="ফাইলের নাম লিখে খুঁজুন..."
                class="w-full pl-12 pr-5 py-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 outline-none focus:ring-2 focus:ring-blue-500"
            >

        </div>

    </div>


    <!-- File Section -->

    <div class="flex items-center justify-between mb-5">

        <div>
            <h2 class="text-2xl font-black">
                📂 Available Files
            </h2>

            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                প্রয়োজনীয় ফাইল নির্বাচন করুন
            </p>
        </div>

    </div>


    <div
        id="fileContainer"
        class="grid grid-cols-1 md:grid-cols-2 gap-5">
    </div>


    <!-- No result -->

    <div
        id="noResult"
        class="hidden text-center py-16">

        <div class="text-5xl mb-4">
            🔍
        </div>

        <h3 class="font-bold text-xl">
            কোনো ফাইল পাওয়া যায়নি
        </h3>

        <p class="text-s
